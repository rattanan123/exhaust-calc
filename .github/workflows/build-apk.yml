# สร้าง APK อัตโนมัติบน GitHub (ฟรี) ทุกครั้งที่ push ขึ้น main หรือกด Run workflow เอง
# ผลลัพธ์: แท็บ Actions → เลือกรอบล่าสุด → Artifacts → "exhaust-calc-debug-apk" (เก็บ 30 วัน)
name: Build APK

on:
  push:
    branches: [main]
    paths: ['www/**', 'package.json', 'capacitor.config.json', '.github/workflows/build-apk.yml']
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # ไม่ใช้ cache: gradle เพราะโฟลเดอร์ android/ ยังไม่มีตอนนี้ (สร้างทีหลังด้วย cap add) → setup-java หาไฟล์ gradle ไม่เจอแล้ว fail

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # โฟลเดอร์ android/ ไม่ได้ commit — สร้างใหม่ทุกรอบจาก www/
      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: exhaust-calc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
